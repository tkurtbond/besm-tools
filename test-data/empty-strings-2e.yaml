# From besm2_fmt's test/data (~/Repos/RPG/Tools/besm2_fmt), where its
# golden tests use it; "PLAN.md" below is the Oberon-2 port's.
# besm2-rst's known differences on it are in README.rst, "Test data".
---
# Strings that are present but empty: each is still written (an empty
# header line and underline, "**" for the tagline, a blank description
# line, "**Size:** "), unlike an absent one (PLAN.md, step 12).
- name: ""
  tagline: ""
  description: ""
  size: ""
  stats:
    - {name: Body, value: 4, points: 4}
- name: Tagline that trims to nothing
  tagline: "   "
  attributes:
    - {name: Empty Effective, level: 2, points: 2, effective: "", details: ""}
    - {name: Blank Details, level: 1, points: 1, details: "  "}
  defects:
    - {name: Empty Details, points: -1, details: ""}
  skills:
    - {name: No Specialisations, level: 1, points: 1, specialisations: []}
- stats:
    - {name: "", value: "", points: 0}
  derived:
    - {name: ACV, value: ""}
